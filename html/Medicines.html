<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicines - VetCare Plus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --light-bg: #f8fafc;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--light-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            width: 100%;
        }

        /* Navbar */
        .navbar {
            background: white;
            box-shadow: 0 2px 8px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
        }

        .navbar-brand .brand-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
        }

        .brand-icon {
            font-size: 1.5rem;
        }

        .navbar-menu {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: all 0.2s;
            font-size: 1rem;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .nav-link:hover {
            background-color: rgba(37, 99, 235, 0.1);
        }

        .nav-link.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 1.5rem 0;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Alerts */
        .alert {
            padding: 0.875rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.25rem;
            transition: transform 0.2s;
        }

        .btn-icon:hover {
            transform: scale(1.2);
        }

        /* Search Section */
        .search-section {
            margin-bottom: 1.5rem;
        }

        .search-form {
            display: flex;
            gap: 0.5rem;
        }

        .search-input {
            flex: 1;
            padding: 0.625rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px var(--shadow);
            overflow-x: auto;
        }

        .medicine-table {
            width: 100%;
            border-collapse: collapse;
        }

        .medicine-table th,
        .medicine-table td {
            padding: 0.875rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .medicine-table th {
            background-color: var(--light-bg);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .medicine-table td {
            font-size: 0.875rem;
        }

        .medicine-table tbody tr:hover {
            background-color: var(--light-bg);
        }

        .no-data {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem !important;
        }

        .quantity-badge {
            padding: 0.25rem 0.625rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .badge-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding-top: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .form-control {
            padding: 0.625rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }

        .required {
            color: var(--danger-color);
        }

        /* Footer */
        .footer {
            background: white;
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 0;
            margin-top: auto;
        }

        .footer p {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .navbar .container {
                flex-direction: column;
                gap: 1rem;
            }

            .navbar-menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== MOBILE RESPONSIVE STYLES ===== */

        @media (max-width: 768px) {
            /* Container */
            .container {
                padding: 0 0.75rem;
            }
            
            /* Navigation */
            .navbar .container {
                flex-direction: column;
                gap: 0.75rem;
                padding: 0.75rem;
            }
            
            .navbar-menu {
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                gap: 0.5rem;
            }
            
            .nav-link {
                padding: 0.625rem 1rem;
                font-size: 0.875rem;
                min-height: 44px;
                display: flex;
                align-items: center;
            }
            
            /* Page Header */
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .page-header h1 {
                font-size: 1.5rem;
            }
            
            /* Stats Grid */
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            
            .stat-card {
                padding: 1rem;
            }
            
            .stat-value {
                font-size: 1.25rem;
            }
            
            /* Tables */
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            .medicine-table {
                min-width: 600px;
            }
            
            .medicine-table th,
            .medicine-table td {
                padding: 0.625rem 0.5rem;
                font-size: 0.8125rem;
            }
            
            /* Forms */
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .form-control {
                font-size: 16px; /* Prevents iOS zoom */
            }
            
            /* Modal */
            .modal-content {
                width: 95%;
                max-width: none;
                margin: 1rem;
            }
            
            .modal-header,
            .modal-body {
                padding: 1rem;
            }
            
            /* Buttons */
            .btn {
                min-height: 44px;
                padding: 0.75rem 1.25rem;
            }
            
            .btn-icon {
                font-size: 1.5rem;
                padding: 0.5rem;
                min-width: 44px;
                min-height: 44px;
            }
            
            .action-buttons {
                gap: 0.75rem;
            }
            
            /* Search */
            .search-form {
                flex-direction: column;
            }
            
            .search-input {
                width: 100%;
            }
        }

        /* Extra small devices */
        @media (max-width: 480px) {
            /* Even smaller text */
            body {
                font-size: 13px;
            }
            
            .page-header h1 {
                font-size: 1.25rem;
            }
            
            /* Stack table data */
            .medicine-table {
                min-width: 100%;
            }
            
            .medicine-table thead {
                display: none;
            }
            
            .medicine-table tbody tr {
                display: block;
                margin-bottom: 1rem;
                border: 1px solid var(--border-color);
                border-radius: 0.5rem;
                padding: 0.75rem;
            }
            
            .medicine-table tbody td {
                display: flex;
                justify-content: space-between;
                padding: 0.5rem 0;
                border-bottom: 1px solid var(--border-color);
            }
            
            .medicine-table tbody td:last-child {
                border-bottom: none;
            }
            
            .medicine-table tbody td:before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-secondary);
            }
            
            /* Full width buttons */
            .header-actions {
                width: 100%;
            }
            
            .header-actions .btn {
                width: 100%;
            }
            
            /* Modal full screen */
            .modal-content {
                width: 100%;
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
                margin: 0;
            }
        }

        /* Landscape mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .navbar .container {
                flex-direction: row;
            }
            
            .navbar-menu {
                flex-direction: row;
                flex-wrap: wrap;
            }
        }        
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="?page=dashboard" class="brand-link">
                    <span class="brand-icon">💊</span>
                    <span class="brand-text">VetCare Plus</span>
                </a>
            </div>
            <div class="navbar-menu">
                <a href="?page=dashboard" class="nav-link">Dashboard</a>
                <a href="?page=medicines" class="nav-link active">Medicines</a>
                <a href="?page=sales" class="nav-link">Sales</a>
                <a href="?page=vaccinations" class="nav-link">Vaccinations</a>
                <button onclick="handleLogout()" class="nav-link">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Flash Messages -->
            <div id="successMessage" class="alert alert-success" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>

            <!-- Page Header -->
            <div class="page-header">
                <h1>Medicines Inventory</h1>
                <div class="header-actions">
                    <button onclick="showAddMedicineModal()" class="btn btn-primary">+ Add New Medicine</button>
                </div>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-form">
                    <input type="text" id="searchInput" placeholder="Search by medicine name, barcode, manufacturer..." class="search-input">
                    <button onclick="searchMedicines()" class="btn btn-primary">Search</button>
                    <button onclick="loadMedicines()" class="btn btn-outline">Clear</button>
                </div>
            </div>

            <!-- Medicines Table -->
            <div class="table-container">
                <table class="medicine-table">
                    <thead>
                        <tr>
                            <th>Barcode</th>
                            <th>Name</th>
                            <th>Manufacturer</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>MRP</th>
                            <th>Selling Price</th>
                            <th>Expiry Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="medicinesTableBody">
                        <tr>
                            <td colspan="9" class="no-data">Loading medicines...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit Medicine Modal -->
    <div id="medicineModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Medicine</h2>
                <button onclick="closeModal()" class="modal-close">&times;</button>
            </div>
            <form id="medicineForm" class="modal-body">
                <input type="hidden" id="medicineId">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="barcode">Barcode <span class="required">*</span></label>
                        <input type="text" id="barcode" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="name">Medicine Name <span class="required">*</span></label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="manufacturer">Manufacturer</label>
                        <input type="text" id="manufacturer" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="quantity">Quantity <span class="required">*</span></label>
                        <input type="number" id="quantity" class="form-control" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="mrp">MRP <span class="required">*</span></label>
                        <input type="number" id="mrp" class="form-control" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="buyingPrice">Buying Price <span class="required">*</span></label>
                        <input type="number" id="buyingPrice" class="form-control" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="sellingPrice">Selling Price <span class="required">*</span></label>
                        <input type="number" id="sellingPrice" class="form-control" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="gstPercentage">GST %</label>
                        <input type="number" id="gstPercentage" class="form-control" step="0.01" min="0" max="100">
                    </div>
                    
                    <div class="form-group">
                        <label for="manufacturingDate">Manufacturing Date</label>
                        <input type="date" id="manufacturingDate" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="expiryDate">Expiry Date <span class="required">*</span></label>
                        <input type="date" id="expiryDate" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="modal-footer">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Medicine</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 VetCare Plus System. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Store the web app URL globally
        var webAppUrl = '';
        let medicines = [];
        
        // Get web app URL on page load
        google.script.run
            .withSuccessHandler(function(url) {
                webAppUrl = url;
                console.log('Web App URL:', webAppUrl);
            })
            .withFailureHandler(function(error) {
                console.error('Error getting web app URL:', error);
            })
            .getWebAppUrl();
        
        // Load medicines on page load
        loadMedicines();
        
        function loadMedicines() {
            console.log('Loading medicines...');
            google.script.run
                .withSuccessHandler(function(data) {
                    console.log('Received data:', data);
                    console.log('Data length:', data.length);
                    medicines = data;
                    renderMedicinesTable(data);
                })
                .withFailureHandler(function(error) {
                    console.error('Error loading medicines:', error);
                    showError('Error loading medicines: ' + error.message);
                })
                .getAllMedicines();
        }
        
        function renderMedicinesTable(data) {
            const tbody = document.getElementById('medicinesTableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="no-data">No medicines found</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(medicine => `
                <tr>
                    <td>${medicine.barcode}</td>
                    <td><strong>${medicine.name}</strong></td>
                    <td>${medicine.manufacturer || '-'}</td>
                    <td>${medicine.category || '-'}</td>
                    <td>
                        <span class="quantity-badge ${medicine.quantity < 10 ? 'badge-danger' : 'badge-success'}">
                            ${medicine.quantity}
                        </span>
                    </td>
                    <td>₹${medicine.mrp.toFixed(2)}</td>
                    <td>₹${medicine.sellingPrice.toFixed(2)}</td>
                    <td>${new Date(medicine.expiryDate).toLocaleDateString()}</td>
                    <td class="action-buttons">
                        <button onclick="viewMedicine('${medicine.id}')" class="btn-icon" title="View">👁️</button>
                        <button onclick="editMedicine('${medicine.id}')" class="btn-icon" title="Edit">✏️</button>
                        <button onclick="deleteMedicine('${medicine.id}')" class="btn-icon" title="Delete">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function searchMedicines() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                loadMedicines();
                return;
            }
            
            google.script.run
                .withSuccessHandler(function(data) {
                    renderMedicinesTable(data);
                })
                .withFailureHandler(function(error) {
                    showError('Error searching medicines: ' + error.message);
                })
                .searchMedicines(query);
        }
        
        function showAddMedicineModal() {
            document.getElementById('modalTitle').textContent = 'Add New Medicine';
            document.getElementById('medicineForm').reset();
            document.getElementById('medicineId').value = '';
            document.getElementById('medicineModal').style.display = 'flex';
        }
        
        function editMedicine(id) {
            const medicine = medicines.find(m => m.id === id);
            if (!medicine) return;
            
            document.getElementById('modalTitle').textContent = 'Edit Medicine';
            document.getElementById('medicineId').value = medicine.id;
            document.getElementById('barcode').value = medicine.barcode;
            document.getElementById('name').value = medicine.name;
            document.getElementById('manufacturer').value = medicine.manufacturer || '';
            document.getElementById('category').value = medicine.category || '';
            document.getElementById('quantity').value = medicine.quantity;
            document.getElementById('mrp').value = medicine.mrp;
            document.getElementById('buyingPrice').value = medicine.buyingPrice;
            document.getElementById('sellingPrice').value = medicine.sellingPrice;
            document.getElementById('gstPercentage').value = medicine.gstPercentage || '';
            
            // Format dates for input fields
            if (medicine.manufacturingDate) {
                const mfgDate = new Date(medicine.manufacturingDate);
                document.getElementById('manufacturingDate').value = mfgDate.toISOString().split('T')[0];
            }
            if (medicine.expiryDate) {
                const expDate = new Date(medicine.expiryDate);
                document.getElementById('expiryDate').value = expDate.toISOString().split('T')[0];
            }
            
            document.getElementById('description').value = medicine.description || '';
            
            document.getElementById('medicineModal').style.display = 'flex';
        }
        
        function viewMedicine(id) {
            const medicine = medicines.find(m => m.id === id);
            if (!medicine) return;
            
            alert(`Medicine Details:\n\nName: ${medicine.name}\nBarcode: ${medicine.barcode}\nManufacturer: ${medicine.manufacturer}\nQuantity: ${medicine.quantity}\nMRP: ₹${medicine.mrp}\nSelling Price: ₹${medicine.sellingPrice}`);
        }
        
        function deleteMedicine(id) {
            if (!confirm('Are you sure you want to delete this medicine?')) return;
            
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        showSuccess(response.message);
                        loadMedicines();
                    } else {
                        showError(response.message);
                    }
                })
                .withFailureHandler(function(error) {
                    showError('Error deleting medicine: ' + error.message);
                })
                .deleteMedicine(id);
        }
        
        function closeModal() {
            document.getElementById('medicineModal').style.display = 'none';
        }
        
        document.getElementById('medicineForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const medicineData = {
                id: document.getElementById('medicineId').value || null,
                barcode: document.getElementById('barcode').value,
                name: document.getElementById('name').value,
                manufacturer: document.getElementById('manufacturer').value,
                category: document.getElementById('category').value,
                quantity: parseInt(document.getElementById('quantity').value),
                mrp: parseFloat(document.getElementById('mrp').value),
                buyingPrice: parseFloat(document.getElementById('buyingPrice').value),
                sellingPrice: parseFloat(document.getElementById('sellingPrice').value),
                gstPercentage: parseFloat(document.getElementById('gstPercentage').value) || 0,
                manufacturingDate: document.getElementById('manufacturingDate').value,
                expiryDate: document.getElementById('expiryDate').value,
                description: document.getElementById('description').value
            };
            
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        showSuccess(response.message);
                        closeModal();
                        loadMedicines();
                    } else {
                        showError(response.message);
                    }
                })
                .withFailureHandler(function(error) {
                    showError('Error saving medicine: ' + error.message);
                })
                .saveMedicine(medicineData);
        });
        
        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }
        
        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }
        
        // Navigation helper function
        function navigateTo(page) {
            try {
                // Try multiple navigation methods for compatibility
                if (window.parent && window.parent !== window) {
                    window.parent.location.href = window.parent.location.origin + window.parent.location.pathname + '?page=' + page;
                } else {
                    window.location.href = window.location.origin + window.location.pathname + '?page=' + page;
                }
            } catch (e) {
                // Fallback to simple relative URL
                window.location.href = '?page=' + page;
            }
        }
        
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                google.script.run
                    .withSuccessHandler(function() {
                        navigateTo('login');
                    })
                    .logout();
            }
        }
        
        // Update all navigation links to use the navigateTo function
        document.addEventListener('DOMContentLoaded', function() {
            // Update all nav links
            document.querySelectorAll('.nav-link[href^="?page="]').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    var page = this.getAttribute('href').replace('?page=', '');
                    navigateTo(page);
                });
            });
            
            // Update brand link
            document.querySelectorAll('.brand-link[href^="?page="]').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    var page = this.getAttribute('href').replace('?page=', '');
                    navigateTo(page);
                });
            });
        });
    </script>
</body>
</html>
